        // ---- EXPORTACIÓN DE MEZCLA Y STEMS ----
        function renderTrackToBuffer(trackType, durationSeconds, trackObj) {
            return new Promise((resolve, reject) => {
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(2, Math.floor(durationSeconds * sampleRate), sampleRate);
                const masterGain = offlineCtx.createGain();
                masterGain.gain.value = 0.8;
                masterGain.connect(offlineCtx.destination);

                if (trackType === 'midi') {
                    const track = trackObj || tracks.find(t => t.type === 'midi');
                    const notes = track.notes;
                    const tickDuration = 60000 / (bpm * BEATS_PER_BAR * TICKS_PER_BEAT) / 1000;
                    const inst = INSTRUMENTS[track.instrument || 'piano'];

                    notes.forEach(n => {
                        const startTime = n.tick * tickDuration;
                        const duration = n.duration * tickDuration;
                        if ((track.instrument || 'piano') === 'bass') {
                            synthBassNote(offlineCtx, masterGain, n.note, (n.velocity || 0.7) * track.volume, startTime, duration);
                            return;
                        }
                        const freq = 440 * Math.pow(2, (n.note - 69) / 12);
                        const osc = offlineCtx.createOscillator();
                        const gainNode = offlineCtx.createGain();
                        osc.type = waveformType;
                        osc.frequency.value = freq;
                        osc.detune.value = (inst.detune || 0) * 10;
                        const vol = (n.velocity || 0.7) * 0.35 * (inst.gain || 0.8) * track.volume;
                        gainNode.gain.setValueAtTime(vol, startTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                        osc.connect(gainNode);
                        gainNode.connect(masterGain);
                        osc.start(startTime);
                        osc.stop(startTime + duration);
                    });
                } else if (trackType === 'perc') {
                    const track = tracks.find(t => t.type === 'perc');
                    const pattern = track.pattern;
                    const tickDuration = 60000 / (bpm * BEATS_PER_BAR * TICKS_PER_BEAT) / 1000;
                    for (let s = 0; s < PERC_SOUNDS; s++) {
                        for (let p = 0; p < PERC_STEPS; p++) {
                            if (pattern[s][p]) {
                                const startTime = p * tickDuration;
                                const sound = currentSounds[s];
                                if (!sound) continue;
                                const gainNode = offlineCtx.createGain();
                                gainNode.gain.setValueAtTime(sound.gain * 0.7 * track.volume, startTime);
                                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + sound.decay);
                                gainNode.connect(masterGain);
                                if (sound.noise) {
                                    const bufferSize = offlineCtx.sampleRate * 0.2;
                                    const buffer = offlineCtx.createBuffer(1, bufferSize, offlineCtx.sampleRate);
                                    const data = buffer.getChannelData(0);
                                    for (let i = 0; i < bufferSize; i++) {
                                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (offlineCtx.sampleRate * 0.025));
                                    }
                                    const noise = offlineCtx.createBufferSource();
                                    noise.buffer = buffer;
                                    const filter = offlineCtx.createBiquadFilter();
                                    filter.type = 'bandpass';
                                    filter.frequency.value = sound.freq;
                                    filter.Q.value = 0.7;
                                    noise.connect(filter);
                                    filter.connect(gainNode);
                                    noise.start(startTime);
                                    noise.stop(startTime + sound.decay);
                                } else {
                                    const osc = offlineCtx.createOscillator();
                                    osc.type = 'sine';
                                    osc.frequency.value = sound.freq;
                                    if (sound.freq < 200 && sound.decay > 0.2) {
                                        osc.frequency.setValueAtTime(sound.freq, startTime);
                                        osc.frequency.exponentialRampToValueAtTime(sound.freq * 0.3, startTime + sound.decay * 0.8);
                                    }
                                    osc.connect(gainNode);
                                    osc.start(startTime);
                                    osc.stop(startTime + sound.decay);
                                }
                            }
                        }
                    }
                }
                offlineCtx.startRendering().then(resolve).catch(reject);
            });
        }

        function renderAudioTrackToBuffer(track, durationSeconds) {
            return new Promise((resolve, reject) => {
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(2, Math.max(1, Math.floor(durationSeconds * sampleRate)), sampleRate);
                const masterGain = offlineCtx.createGain();
                masterGain.gain.value = track.volume;
                masterGain.connect(offlineCtx.destination);
                (track.clips || []).forEach(clip => {
                    if (!clip.buffer) return;
                    const source = offlineCtx.createBufferSource();
                    source.buffer = clip.buffer;
                    source.connect(masterGain);
                    const startTime = clip.tick * secPerTick();
                    source.start(Math.max(0, startTime));
                });
                offlineCtx.startRendering().then(resolve).catch(reject);
            });
        }

        function audioTracks() {
            return tracks.filter(t => t.type === 'audio');
        }

        async function exportMix() {
            const hasAudio = audioTracks().some(t => t.clips && t.clips.length > 0);
            const hasMidi = midiTracks().some(t => t.notes.length > 0);
            if (!hasMidi && tracks[1].pattern.every(row => row.every(v => v === 0)) && !hasAudio) {
                alert('No hay contenido para exportar.');
                return;
            }
            const durationSec = totalTicks * (60000 / (bpm * BEATS_PER_BAR * TICKS_PER_BEAT)) / 1000;
            const sampleRate = 44100;
            const offlineCtx = new OfflineAudioContext(2, Math.floor(durationSec * sampleRate), sampleRate);
            const masterGain = offlineCtx.createGain();
            masterGain.gain.value = 0.8;
            masterGain.connect(offlineCtx.destination);

            for (const midiTrack of midiTracks()) {
                if (midiTrack.notes.length === 0) continue;
                const midiBuffer = await renderTrackToBuffer('midi', durationSec, midiTrack);
                const source = offlineCtx.createBufferSource();
                source.buffer = midiBuffer;
                source.connect(masterGain);
                source.start(0);
            }
            if (tracks[1].pattern.some(row => row.some(v => v === 1))) {
                const percBuffer = await renderTrackToBuffer('perc', durationSec);
                const source = offlineCtx.createBufferSource();
                source.buffer = percBuffer;
                source.connect(masterGain);
                source.start(0);
            }
            audioTracks().forEach(track => {
                (track.clips || []).forEach(clip => {
                    if (!clip.buffer) return;
                    const source = offlineCtx.createBufferSource();
                    source.buffer = clip.buffer;
                    const gain = offlineCtx.createGain();
                    gain.gain.value = track.volume;
                    source.connect(gain);
                    gain.connect(masterGain);
                    const startTime = clip.tick * secPerTick();
                    source.start(Math.max(0, startTime));
                });
            });

            const renderedBuffer = await offlineCtx.startRendering();
            const wavData = audioBufferToWav(renderedBuffer);
            const blob = new Blob([wavData], { type: 'audio/wav' });
            downloadBlob(blob, 'mezcla_final.wav');
        }

        async function exportStems() {
            const hasAudio = audioTracks().some(t => t.clips && t.clips.length > 0);
            const hasMidi = midiTracks().some(t => t.notes.length > 0);
            if (!hasMidi && tracks[1].pattern.every(row => row.every(v => v === 0)) && !hasAudio) {
                alert('No hay contenido para exportar.');
                return;
            }
            const durationSec = totalTicks * (60000 / (bpm * BEATS_PER_BAR * TICKS_PER_BEAT)) / 1000;
            const zip = new JSZip();

            for (const midiTrack of midiTracks()) {
                if (midiTrack.notes.length > 0) {
                    const buffer = await renderTrackToBuffer('midi', durationSec, midiTrack);
                    const wavData = audioBufferToWav(buffer);
                    const fname = midiTrack.name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_stem.wav';
                    zip.file(fname, wavData);
                }
            }
            if (tracks[1].pattern.some(row => row.some(v => v === 1))) {
                const buffer = await renderTrackToBuffer('perc', durationSec);
                const wavData = audioBufferToWav(buffer);
                zip.file('percusión_stem.wav', wavData);
            }
            for (const track of audioTracks()) {
                if (track.clips && track.clips.length > 0) {
                    const buffer = await renderAudioTrackToBuffer(track, durationSec);
                    const wavData = audioBufferToWav(buffer);
                    const fname = track.name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_stem.wav';
                    zip.file(fname, wavData);
                }
            }

            const zipBlob = await zip.generateAsync({ type: 'blob' });
            downloadBlob(zipBlob, 'stems_completos.zip');
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const length = buffer.length * numChannels * 2;
            const data = new Float32Array(length);
            for (let ch = 0; ch < numChannels; ch++) {
                const channelData = buffer.getChannelData(ch);
                for (let i = 0; i < buffer.length; i++) {
                    data[i * numChannels + ch] = channelData[i];
                }
            }
            const wav = new Uint8Array(44 + data.length * 2);
            const view = new DataView(wav.buffer);
            const writeString = (offset, str) => {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + data.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, data.length * 2, true);
            let offset = 44;
            for (let i = 0; i < data.length; i++) {
                const sample = Math.max(-1, Math.min(1, data[i]));
                const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(offset, int16, true);
                offset += 2;
            }
            return wav;
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadAudioFile(file) {
            return new Promise((resolveOuter) => {
                console.log('[Sensitive DAW] cargando archivo de audio:', file.name, file.type, file.size, 'bytes');
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                // watchdog: si decodeAudioData no resuelve en 20s, avisamos en vez de quedar colgados en silencio
                let settled = false;
                const watchdog = setTimeout(() => {
                    if (!settled) {
                        console.warn('[Sensitive DAW] decodeAudioData no respondió a tiempo para', file.name);
                        document.getElementById('audioStatus').textContent = `⚠️ ${file.name} tardó demasiado (¿formato no soportado?)`;
                    }
                }, 8000);

                file.arrayBuffer()
                    .then(arrayBuffer => {
                        console.log('[Sensitive DAW] archivo leído OK, bytes:', arrayBuffer.byteLength, '— audioCtx.state:', ctx.state, '— iniciando decodeAudioData...');
                        return ctx.decodeAudioData(arrayBuffer);
                    })
                    .then(buffer => {
                        settled = true;
                        clearTimeout(watchdog);
                        const clipTick = currentTick;
                        tracks[3].clips.push({
                            id: Date.now() + Math.random(),
                            tick: clipTick,
                            buffer,
                            name: file.name.replace(/\.[^/.]+$/, '')
                        });
                        const neededTicks = clipTick + ticksFromSeconds(buffer.duration);
                        if (neededTicks > totalTicks) {
                            updateTotalBars(Math.min(256, Math.ceil(neededTicks / (BEATS_PER_BAR * TICKS_PER_BEAT)) + 1));
                        }
                        renderSequencer();
                        document.getElementById('audioStatus').textContent = `✅ ${tracks[3].clips.length} bloque(s) en Audio importado`;
                        console.log('[Sensitive DAW] audio cargado OK:', file.name, buffer.duration.toFixed(1) + 's');
                        resolveOuter();
                    })
                    .catch(err => {
                        settled = true;
                        clearTimeout(watchdog);
                        console.error('[Sensitive DAW] error cargando audio:', file.name, err);
                        document.getElementById('audioStatus').textContent = `❌ error con ${file.name}`;
                        alert(`No se pudo cargar "${file.name}": ${err && err.message ? err.message : err}`);
                        resolveOuter();
                    });
            });
        }

        // ---- GRABACIÓN DE AUDIO ----
        let mediaRecorder = null;
        let audioChunks = [];
        let isAudioRecording = false;
        let meterInterval = null;
        let recordStartTick = 0;

        async function toggleAudioRecording() {
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            if (isAudioRecording) {
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                isAudioRecording = false;
                const btn = document.getElementById('audioRecBtn');
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-circle"></i> Rec';
                document.getElementById('audioStatus').textContent = '⏸';
                if (meterInterval) clearInterval(meterInterval);
                document.getElementById('audioMeter').style.width = '0%';
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                meterInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    const avg = sum / dataArray.length;
                    const percent = Math.min(100, (avg / 128) * 100);
                    document.getElementById('audioMeter').style.width = percent + '%';
                }, 50);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/wav' });
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        const arrayBuffer = ev.target.result;
                        const ctx2 = getAudioContext();
                        const buffer = await ctx2.decodeAudioData(arrayBuffer);
                        tracks[2].clips.push({
                            id: Date.now() + Math.random(),
                            tick: recordStartTick,
                            buffer,
                            name: `Voz ${tracks[2].clips.length + 1}`
                        });
                        renderSequencer();
                        document.getElementById('audioStatus').textContent = `✅ ${tracks[2].clips.length} bloque(s) en Voz (Mic)`;
                    };
                    reader.readAsArrayBuffer(blob);
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(meterInterval);
                    document.getElementById('audioMeter').style.width = '0%';
                    document.getElementById('audioRecBtn').classList.remove('active');
                    document.getElementById('audioRecBtn').innerHTML = '<i class="fas fa-circle"></i> Rec';
                    isAudioRecording = false;
                };
                recordStartTick = currentTick;
                mediaRecorder.start();
                isAudioRecording = true;
                const btn = document.getElementById('audioRecBtn');
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-stop"></i> Detener';
                document.getElementById('audioStatus').textContent = '🔴 Grabando...';
            } catch (err) {
                alert('No se pudo acceder al micrófono.');
                console.error(err);
            }
        }

        // ---- MIDI ----
        let midiAccess = null;
        async function initMIDI() {
            try {
                if (!navigator.requestMIDIAccess) {
                    document.getElementById('midiLabel').textContent = 'No soportado';
                    return;
                }
                midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                updateMIDIStatus();
                midiAccess.onstatechange = () => updateMIDIStatus();
                midiAccess.inputs.forEach(input => {
                    input.onmidimessage = onMIDIMessage;
                });
                midiAccess.onstatechange = (event) => {
                    if (event.port.type === 'input' && event.port.state === 'connected') {
                        event.port.onmidimessage = onMIDIMessage;
                        updateMIDIStatus();
                    }
                };
            } catch (err) {
                console.error('MIDI error:', err);
                document.getElementById('midiLabel').textContent = 'Error';
            }
        }

        function updateMIDIStatus() {
            const dot = document.getElementById('midiDot');
            const label = document.getElementById('midiLabel');
            if (midiAccess && midiAccess.inputs.size > 0) {
                dot.className = 'dot on';
                label.textContent = `${midiAccess.inputs.size} disp.`;
            } else {
                dot.className = 'dot off';
                label.textContent = 'Desconectado';
            }
        }

        function onMIDIMessage(event) {
            if (!midiEnabled) return;
            const data = event.data;
            const status = data[0] & 0xF0;
            const note = data[1];
            const velocity = data[2] / 127;

            if (status === 0x90 && velocity > 0) {
                if (midiMode === 'percussion') {
                    const percIndex = MIDI_TO_PERC[note];
                    if (percIndex !== undefined) {
                        playPercSound(percIndex, velocity * 0.8);
                        const pads = document.querySelectorAll('.pad');
                        if (pads[percIndex]) {
                            pads[percIndex].classList.add('active');
                            setTimeout(() => pads[percIndex].classList.remove('active'), 150);
                        }
                        if (seqMode) {
                            const step = currentTick % PERC_STEPS;
                            tracks[1].pattern[percIndex][step] = tracks[1].pattern[percIndex][step] ? 0 : 1;
                            renderSequencer();
                            updatePadsLight();
                        }
                    }
                } else {
                    let shiftedNote = note + octaveShift * 12 + transposeShift;
                    const targetTrack = tracks[midiRecordTrackIndex];
                    const inst = targetTrack.instrument || 'piano';
                    playNote(shiftedNote, velocity * 0.7, inst);
                    if (midiRecording) {
                        const tick = Math.floor(currentTick / 4) * 4;
                        const exists = targetTrack.notes.some(n => Math.abs(n.tick - tick) < 2 && n.note === shiftedNote);
                        if (!exists && tick >= 0 && tick < totalTicks) {
                            targetTrack.notes.push({ tick, note: shiftedNote, duration: 4, velocity: 0.7 });
                            renderSequencer();
                        }
                    }
                    const keys = document.querySelectorAll('.piano-key-big');
                    keys.forEach(key => {
                        if (parseInt(key.dataset.note) === note) {
                            key.classList.add('pressed');
                            setTimeout(() => key.classList.remove('pressed'), 200);
                        }
                    });
                }
            }
        }

        // ---- CONTROLES ----
        function setupScaleControls() {
            const tonicSelect = document.getElementById('tonicSelect');
            const scaleSelect = document.getElementById('scaleSelect');
            tonicSelect.addEventListener('change', () => {
                currentTonic = parseInt(tonicSelect.value);
                updateScaleNotes();
            });
            scaleSelect.addEventListener('change', () => {
                currentScale = scaleSelect.value;
                updateScaleNotes();
            });
            currentTonic = parseInt(tonicSelect.value);
            currentScale = scaleSelect.value;
            updateScaleNotes();
        }

        function setupPianoControls() {
            const octaveDisplay = document.getElementById('octDisplay');
            const transposeDisplay = document.getElementById('transDisplay');
            document.getElementById('octDown').addEventListener('click', () => {
                octaveShift = Math.max(-3, octaveShift - 1);
                octaveDisplay.textContent = octaveShift;
                renderPiano();
            });
            document.getElementById('octUp').addEventListener('click', () => {
                octaveShift = Math.min(3, octaveShift + 1);
                octaveDisplay.textContent = octaveShift;
                renderPiano();
            });
            document.getElementById('transDown').addEventListener('click', () => {
                transposeShift = Math.max(-12, transposeShift - 1);
                transposeDisplay.textContent = transposeShift;
            });
            document.getElementById('transUp').addEventListener('click', () => {
                transposeShift = Math.min(12, transposeShift + 1);
                transposeDisplay.textContent = transposeShift;
            });
            document.getElementById('waveformSelect').addEventListener('change', (e) => {
                waveformType = e.target.value;
            });
            document.getElementById('masterVol').addEventListener('input', (e) => {
                masterVolume = parseFloat(e.target.value) / 100;
            });
        }

        function setupInstrumentSelector() {
            const select = document.getElementById('instrumentSelect');
            select.addEventListener('change', () => {
                tracks[midiRecordTrackIndex].instrument = select.value;
            });
        }

        function setupBPM() {
            const slider = document.getElementById('bpmSlider');
            const number = document.getElementById('bpmNumber');
            slider.addEventListener('input', () => {
                bpm = parseInt(slider.value);
                number.textContent = bpm;
                if (isPlaying) { stopPlay();
                    startPlay(); }
            });
        }

        function setupBarsControl() {
            document.getElementById('barsDown').addEventListener('click', () => {
                updateTotalBars(totalBars - 1);
            });
            document.getElementById('barsUp').addEventListener('click', () => {
                updateTotalBars(totalBars + 1);
            });
        }

        function highlightWorkMode(mode) {
            ['midi', 'bajo', 'voz', 'audio'].forEach(key => {
                const btn = document.getElementById('workMode' + key.charAt(0).toUpperCase() + key.slice(1));
                if (btn) btn.classList.toggle('active', key === mode);
            });
        }

        function setupWorkModeButtons() {
            const btns = {
                midi: document.getElementById('workModeMidi'),
                bajo: document.getElementById('workModeBajo'),
                voz: document.getElementById('workModeVoz'),
                audio: document.getElementById('workModeAudio')
            };
            function scrollToPanel(id) {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            btns.midi.addEventListener('click', () => {
                highlightWorkMode('midi');
                midiRecordTrackIndex = tracks.findIndex(t => t.type === 'midi' && t.name === 'MIDI');
                if (midiRecordTrackIndex === -1) midiRecordTrackIndex = 0;
                document.getElementById('midiTargetSelect').value = midiRecordTrackIndex;
                document.getElementById('instrumentSelect').value = tracks[midiRecordTrackIndex].instrument || 'piano';
            });
            btns.bajo.addEventListener('click', () => {
                highlightWorkMode('bajo');
                midiRecordTrackIndex = tracks.findIndex(t => t.type === 'midi' && t.name === 'Bajo');
                if (midiRecordTrackIndex === -1) midiRecordTrackIndex = 0;
                document.getElementById('midiTargetSelect').value = midiRecordTrackIndex;
                document.getElementById('instrumentSelect').value = tracks[midiRecordTrackIndex].instrument || 'bass';
            });
            btns.voz.addEventListener('click', () => {
                highlightWorkMode('voz');
                scrollToPanel('audioRecBtn');
            });
            btns.audio.addEventListener('click', () => {
                highlightWorkMode('audio');
                document.getElementById('audioFileInput').click();
            });
            highlightWorkMode('midi'); // arranca armado en Teclado por defecto
        }

        function setupMidiTargetSelect() {
            const select = document.getElementById('midiTargetSelect');
            const instSelect = document.getElementById('instrumentSelect');
            function rebuild() {
                select.innerHTML = '';
                tracks.forEach((t, idx) => {
                    if (t.type !== 'midi') return;
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = t.name;
                    select.appendChild(opt);
                });
                select.value = midiRecordTrackIndex;
            }
            rebuild();
            select.addEventListener('change', () => {
                midiRecordTrackIndex = parseInt(select.value);
                instSelect.value = tracks[midiRecordTrackIndex].instrument || 'piano';
                const t = tracks[midiRecordTrackIndex];
                highlightWorkMode(t.name === 'Bajo' ? 'bajo' : 'midi');
            });
        }

        function setupMidiToggle() {
            const btn = document.getElementById('midiToggleBtn');
            btn.addEventListener('click', async () => {
                midiEnabled = !midiEnabled;
                btn.textContent = midiEnabled ? 'MIDI ON' : 'MIDI OFF';
                btn.classList.toggle('off', !midiEnabled);
                if (midiEnabled) {
                    // Al activar, siempre reintenta la conexión — así detecta un
                    // controlador que se haya enchufado después de cargar la página.
                    await initMIDI();
                }
            });
        }

        // ---- EVENTOS PRINCIPALES ----
        document.getElementById('playBtn').addEventListener('click', () => {
            if (isPlaying) stopPlay();
            else startPlay();
        });
        document.getElementById('stopBtn').addEventListener('click', stopPlay);
        document.getElementById('recordBtn').addEventListener('click', toggleAudioRecording);
        document.getElementById('audioRecBtn').addEventListener('click', toggleAudioRecording);
        document.getElementById('clearBtn').addEventListener('click', clearAll);

        // ---- INICIALIZACIÓN ----
        renderSequencer();
        renderPiano();
        renderMixer();
        renderPads();
        setupScaleControls();
        setupPianoControls();
        setupInstrumentSelector();
        setupBPM();
        setupBarsControl();
        setupTimebarEvents();
        setupNavButtons();
        function setupTrackClearButtons() {
            document.getElementById('clearInstrumentTrackBtn').addEventListener('click', () => {
                const track = tracks[midiRecordTrackIndex];
                if (!track || !track.notes.length) { alert(`"${track ? track.name : 'esta pista'}" no tiene notas para borrar.`); return; }
                if (!confirm(`¿Borrar todas las notas de "${track.name}"?`)) return;
                track.notes = [];
                renderSequencer();
            });
            document.getElementById('clearAudioTrackBtn').addEventListener('click', () => {
                const track = tracks.find(t => t.name === 'Audio importado');
                if (!track || !track.clips.length) { alert('No hay audio importado para borrar.'); return; }
                if (!confirm('¿Borrar todos los bloques de audio importado?')) return;
                track.clips = [];
                renderSequencer();
                document.getElementById('audioStatus').textContent = '⏸';
            });
        }

        setupMidiToggle();
        setupMidiTargetSelect();
        setupWorkModeButtons();
        setupTrackClearButtons();
        setupSeqMode();
        setupLoopToggle();
        setupMidiRec();
        setupMidiMode();
        setupGenres();
        setupExportButtons();
        setupAudioFileLoader();
        initMIDI();
        updateTimeDisplay();
        updatePadsLight();
        updateLoopOverlay();

        console.log('🎯 Sensitive DAW · Completo con mezcla y stems');
        console.log('✅ Exporta mezcla completa (WAV) o stems en ZIP.');
        console.log('✅ Contenido de ejemplo para empezar.');
        console.log('✅ Loop, grabación MIDI, percusión MIDI, géneros.');
    </script>
</body>
</html>
